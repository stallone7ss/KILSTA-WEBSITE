# Supabase CLI configuration for the KILSTA project.
# Start local services with: supabase start
# Apply migrations with:     supabase db reset   (local only)
# Push migrations with:      supabase db push    (linked remote project)

project_id = "kilsta-business-ict"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/reset-password",
  "http://127.0.0.1:5173/reset-password",
  "https://YOUR-VERCEL-PROJECT.vercel.app/reset-password"
]
jwt_expiry = 3600
enable_signup = false
enable_confirmations = false

[auth.email]
enable_signup = false
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "10MiB"
